    <path d="m1213 380 11 37 54 35-13-27Z" fill="#acaaa9" opacity=".45"/>
    <path d="M0 439 45 418 77 433 124 389 158 416 195 407 248 443 279 425 333 468 381 450 421 476 461 462 516 493 556 475 611 492 657 481 711 510 749 496 810 523 861 511 913 539 973 519 1036 532 1092 513 1145 529 1198 508 1252 527 1304 509 1354 526 1404 508 1440 516v84H0Z" fill="url(#near)"/>
    <path d="m1139 600 42-68 37-41 23-12 44-57 29 14 29-41 45-23 52 18v210Z" fill="#345775"/>
    <path d="m1440 390-52-18-45 23-29 41 25-3 23-18 31 17 47 13Z" fill="#65839a"/>
    <path d="m1388 372-8 50-41 64-10 60-43 54h154V451l-47-19-31-17Z" fill="#254760" opacity=".65"/>
    <!-- Foreground rock ledge and the narrow trail up to the lookout. -->
    <path d="M0 403 47 400 93 411 128 407 170 420 211 414 256 430 297 424 340 434 376 426 413 431 447 420 473 428 499 425 519 438 552 441 577 459 542 474 504 480 480 510 443 529 426 563 397 600H0Z" fill="url(#earth)"/>
    <path d="M0 403 47 400 93 411 128 407 170 420 211 414 256 430 297 424 340 434 376 426 413 431 447 420 473 428 499 425 519 438 552 441 577 459l-35-3-40-11-29-6-26-6-33 9-38-5-35 7-44-10-42 5-44-14-42 7-41-14-34 5-48-12-46 3Z" fill="url(#edge)"/>
    <path d="m0 529 97-22 112-17 96-24 86-22 56-15-31 18-91 32-111 24-89 34L30 600H0Z" fill="#899084" opacity=".45"/>
    <path d="m0 541 111-28 102-19 97-26 75-20-81 29-103 29-85 22L30 565Z" fill="#c7b497" opacity=".22"/>
    <path d="m542 474-51 7-55-4-19 29 12 26 15-3 36-19 24-30Z" fill="#112d3c"/>

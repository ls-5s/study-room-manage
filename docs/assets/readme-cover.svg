    <g transform="translate(445 420)">
      <path d="m-2-45-7 22-3 21 6 2 6-21 7-17Z" fill="#172b3c"/>
      <path d="m5-43 7 20 2 21 7 1-2-25-5-20Z" fill="#203347"/>
      <path d="m-12-3-5 3q5 5 13 1l-1-4Zm27 0-1 4h12q1-3-5-4Z" fill="#102738"/>
      <path d="m-4-80 16-4 12 19-6 21-24 1-5-17Z" fill="#dba973"/>
      <path d="m12-84 12 19-6 21-6-2 3-21-6-11Z" fill="#bd805c"/>
      <path d="m-4-80-9 10-5 25 5 2 8-23 5-10Z" fill="#d7a26e"/>
      <path d="m18-77 7 15 7 10-3 4-11-12-6-16Z" fill="#e8b57e"/>
      <path d="m-17-46 4 1-1 7-4-1Zm46-6 3 1 3 6-3 2-4-5Z" fill="#d6ac8d"/>
      <path d="m-5-79-10 5-5 19 11 8 6-11Z" fill="#244a57"/>
      <path d="m-7-77-5 8-4 17" fill="none" stroke="#57716d" stroke-width="2"/>
      <path d="m3-89 9-1 2 8-10 4Z" fill="#e0b696"/>
      <path d="m2-106 13 1 2 11-5 8-10-3-4-9Z" fill="#e5b89a"/>
      <path d="m-3-99 1-9 8-5 12 5 2 9-6-3-4 1-3-4-2 7-6 4Z" fill="#1c2d3a"/>
      <path d="m2-84 12-1 1 6-14 2Z" fill="#e57460"/>
      <path d="M2-82q-20-16-35-7t-29-1q12 16 26 11t35 3Z" fill="#e57460"/>
      <path d="M-5-82q-18-9-31-4t-19-1" fill="none" stroke="#f5a182" stroke-width="1.5" opacity=".6"/>
    </g>
    <!-- Grass catches the last warm light along the ridge. -->
    <g fill="none" stroke="#b5a885" stroke-width="1.3" stroke-linecap="round" opacity=".8">
      <path d="m393 430-3-14m3 10 5-7m-37 11-4-11m4 7 4-6m117 11 3-10m-3 6-4-5m40 15 2-12m-2 7-4-5m-206 0-4-12m4 8 3-7m-147-8-3-11m3 8 5-6"/>
    </g>
    <g fill="#9a9f86" opacity=".7">
      <path d="m0 568 7-35 5 25 14-38-2 37 15-15-8 31Zm54 32 3-30 5 13 10-22-2 24 12-10-6 25Zm207 0 5-28 5 10 11-22-5 30 15-7-6 17Z"/>
    </g>
    <g fill="none" stroke="#4e6378" stroke-width="2" stroke-linecap="round" opacity=".9">
      <path d="m889 176 8 2 7-6m-38 24 5 1 5-3m59-37 7 2 6-4"/>
    </g>
    <rect width="1440" height="600" fill="transparent" filter="url(#grain)" opacity=".5" pointer-events="none"/>
  </g>
</svg>

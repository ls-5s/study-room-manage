    <path d="m0 402 49-18 46-50 34 25 33-16 59 41 42-26 45 42 45-4 49-27 37 25 40-50 36 20 46-68 28 27 18-7 37 63 30-19 31 30 46-36 53 58 34-17 57 40 37-9 57 32 47-28 32 15 65-48 40 17 43-25 43 24 41-7 65 22 70-17v170H0Z" fill="url(#ridge)"/>
    <path d="m557 296 15 50 40 39 17 40-61-26-18-46-29 12Z" fill="#9a9fa8" opacity=".55"/>
    <path d="m557 296-31 74-33 37-43 16 31-55 30-4Z" fill="#3e6087"/>
    <path d="m479 344 10 45-38 29-39 4 27-28Z" fill="#6585a2"/>

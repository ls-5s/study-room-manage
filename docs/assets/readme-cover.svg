<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">此去，乘风</title>
  <desc id="desc">一位背着行囊的少年站在高处，红色围巾随风扬起。蓝色山峦层叠向远方，金色落日照亮山谷，飞鸟掠过开阔的天空。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#284b76"/>
      <stop offset=".42" stop-color="#718ca7"/>
      <stop offset=".76" stop-color="#e8b99f"/>
      <stop offset="1" stop-color="#f8d9aa"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#ffdeb1" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#ffd8aa" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffd8aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x2="0" y2="1">
      <stop stop-color="#fff1c6"/>
      <stop offset="1" stop-color="#f8c58b"/>
    </linearGradient>
    <linearGradient id="far" x2="0" y2="1">
      <stop stop-color="#9b9fb0"/>
      <stop offset="1" stop-color="#c6b3b2"/>
    </linearGradient>
    <linearGradient id="ridge" x2="0" y2="1">
      <stop stop-color="#48688c"/>
      <stop offset="1" stop-color="#8197ac"/>
    </linearGradient>
    <linearGradient id="near" x2="0.7" y2="1">
      <stop stop-color="#244862"/>
      <stop offset="1" stop-color="#152d49"/>
    </linearGradient>
    <linearGradient id="earth" x2="0" y2="1">
      <stop stop-color="#395459"/>
      <stop offset="1" stop-color="#142c3d"/>
    </linearGradient>
    <linearGradient id="edge" x2="1" y2="0">
      <stop stop-color="#718376"/>
      <stop offset=".75" stop-color="#b7ac82"/>
      <stop offset="1" stop-color="#d0b48a"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <clipPath id="frame"><rect width="1440" height="600" rx="12"/></clipPath>
    <style>
      .cloud{animation:wind 28s ease-in-out infinite alternate}
      .cloud-back{animation:wind 38s ease-in-out infinite alternate-reverse}
      @keyframes wind{to{transform:translateX(18px)}}
      @media(prefers-reduced-motion:reduce){.cloud,.cloud-back{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1440" height="600" fill="url(#sky)"/>
    <ellipse cx="1065" cy="232" rx="440" ry="310" fill="url(#light)"/>
    <circle cx="1065" cy="232" r="75" fill="url(#sun)"/>
    <!-- Long, wind-shaped clouds keep the sky open. -->
    <g class="cloud-back" fill="#e9d2c1" opacity=".21">
      <path d="M-35 96q76-13 147-4l54-10 100 4 89-10 117 11 65 9-186 5-107-3-130 9Z"/>
      <path d="m924 83 70-6 53 5 64-8 98 9 112-2 151 12-182 5-141-6-126 5Z"/>
      <path d="m504 166 55-7 83 4 67-7 130 12-135 3-78-3-92 5Z"/>
    </g>
    <g class="cloud" fill="#ffe5c4" opacity=".58">
      <path d="m802 211 86-6 56 5 63-8 79 3 39-5 88 9 101 4-173 4-115-3-120 5Z"/>
      <path d="m1105 265 90-5 87 6 72-6 115 10-129 4-93-4-112 3Z"/>
      <path d="m76 187 85-7 52 5 68-3 98 9-128 4-74-4-75 3Z" opacity=".55"/>
    </g>
    <g fill="#f9d9b5" opacity=".22">
      <path d="m0 275 151-5 133 6 162-3 190 9-286 3-172-6-178 4Z"/>
      <path d="m690 308 133-3 110 5 201-6 211 8 95-4v7l-212 5-239-5-168 4Z"/>
